<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hevio.id | Official Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Syne', sans-serif;
    }

    body {
      /* Background Carbon Fiber Pattern dengan pencahayaan gelap elegan */
      background: 
        radial-gradient(ellipse at center, rgba(30, 30, 35, 0.4) 0%, rgba(5, 5, 7, 0.95) 100%),
        linear-gradient(27deg, #111 5px, transparent 5px) 0 5px,
        linear-gradient(207deg, #111 5px, transparent 5px) 10px 0px,
        linear-gradient(27deg, #1a1a1a 5px, transparent 5px) 0px 10px,
        linear-gradient(207deg, #1a1a1a 5px, transparent 5px) 10px 5px,
        linear-gradient(90deg, #0d0d0d 10px, #161616 10px);
      background-size: 100% 100%, 20px 20px, 20px 20px, 20px 20px, 20px 20px, 20px 20px;
      background-color: #08080a;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 18px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* KARTU PROFIL UTAMA (FROSTED GLASS CARD) */
    .profile-card {
      background: linear-gradient(
        135deg, 
        rgba(255, 255, 255, 0.16) 0%, 
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0.02) 100%
      );
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-top: 1.5px solid rgba(255, 255, 255, 0.5);
      border-radius: 36px;
      padding: 36px 22px 28px 22px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.7),
        inset 0 1px 2px rgba(255, 255, 255, 0.4);
      margin-bottom: 18px;
    }

    /* Logo Chrome Besar di Dalam Kotak */
    .logo-img {
      width: 160px;
      height: auto;
      max-height: 130px;
      object-fit: contain;
      margin-bottom: 24px;
      filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.8)) drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
    }

    .bio .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      display: inline-block;
      letter-spacing: 0.3px;
    }

    .bio .subtitle {
      font-size: 0.92rem;
      color: #b5b5ba;
      line-height: 1.6;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .bio .tagline {
      font-size: 0.86rem;
      color: #7e7e86;
      font-style: italic;
      font-weight: 400;
    }

    /* LIST TOMBOL LINK */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    /* TOMBOL LINK BULAT PILL KACA */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-top: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50px; /* Bentuk Pill Capsule */
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.2s ease;
    }

    .link-card:active {
      transform: scale(0.97);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.08) 100%
      );
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.8);
    }

    footer {
      font-size: 0.8rem;
      color: #55555c;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- KARTU ATAS (FROSTED BOX) -->
    <div class="profile-card">
      <img class="logo-img" src="https://i.ibb.co.com/zTyTFJ38/image.png" alt="Hevio Logo">
      
      <div class="bio">
        <span class="title">Welcome To Hevio.id 🤍</span>
        <div class="subtitle">
          Satu toko, lengkapin gayamu ✨<br>
          Shoes 👟 | Fashion 👕 | Bags 👜
        </div>
        <div class="tagline">
          Find your style, make it yours.
        </div>
      </div>
    </div>

    <!-- TOMBOL LINK PILL -->
    <div class="links">
      <a href="https://wa.me/6283114835790" target="_blank" class="link-card">
        Hubungi Admin via WA 💬
      </a>

      <a href="https://instagram.com/hevio.id" target="_blank" class="link-card">
        Kunjungi Instagram Hevio.id 📸
      </a>

      <a href="#" target="_blank" class="link-card">
        Katalog Sepatu & Fashion 🛍️
      </a>

      <a href="#" target="_blank" class="link-card">
        Cek Stok & Ukuran 📦
      </a>
    </div>

    <footer>
      &copy; 2026 Hevio.id
    </footer>
  </div>

</body>
</html>
