<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hevio.id | Official Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Syne', sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 10%, #222226 0%, #0d0d0f 100%);
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 36px 18px;
      position: relative;
      overflow-x: hidden;
    }

    /* Aksen glow di background */
    body::before {
      content: '';
      position: absolute;
      width: 260px;
      height: 260px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
      top: 15%;
      left: 8%;
      pointer-events: none;
      filter: blur(40px);
    }

    body::after {
      content: '';
      position: absolute;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(180, 180, 180, 0.06) 0%, transparent 70%);
      bottom: 15%;
      right: 8%;
      pointer-events: none;
      filter: blur(40px);
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .header-assets {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }

    /* Foto Profil Logo */
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      background: #000;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 255, 255, 0.1);
    }

    /* Banner / Logo Teks */
    .logo-text {
      width: auto;
      height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(255, 255, 255, 0.2));
    }

    /* Section Deskripsi / Bio */
    .bio {
      font-size: 0.95rem;
      color: #b0b0b5;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .bio .title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
      display: inline-block;
      letter-spacing: 0.3px;
    }

    .bio .tagline {
      font-size: 0.88rem;
      color: #8e8e93;
      font-style: italic;
      margin-top: 6px;
      display: inline-block;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 34px;
    }

    /* Tombol Frosted Glass */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 22px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.14) 0%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-top: 1px solid rgba(255, 255, 255, 0.38);
      border-radius: 22px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: 0.4px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      box-shadow: 
        0 10px 30px -8px rgba(0, 0, 0, 0.7),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease;
    }

    .link-card:active {
      transform: scale(0.97);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.08) 100%
      );
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 4px 15px -4px rgba(0, 0, 0, 0.8),
        0 0 20px rgba(255, 255, 255, 0.2),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
    }

    footer {
      font-size: 0.8rem;
      color: #6a6a72;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-assets">
      <!-- Foto Profil Hevio.id -->
      <img class="profile-img" src="https://ibb.co.com/Z1BYNHMB" alt="Logo Hevio.id">
      
      <!-- Link teks logo (jika ada file gambar tulisan terpisah, bisa diganti src-nya) -->
      <img class="logo-text" src="https://via.placeholder.com/200x50" alt="Hevio.id">
    </div>

    <!-- Deskripsi Toko -->
    <div class="bio">
      <span class="title">Welcome To Hevio.id 🤍</span><br>
      Satu toko, lengkapin gayamu ✨<br>
      Shoes 👟 | Fashion 👕 | Bags 👜<br>
      <span class="tagline">Find your style, make it yours.</span>
    </div>

    <div class="links">
      <a href="https://wa.me/6283114835790" target="_blank" class="link-card">
        Hubungi Admin via WA 💬
      </a>

      <a href="https://instagram.com/hevio.id" target="_blank" class="link-card">
        Kunjungi Instagram Hevio.id 📸
      </a>

      <a href="#" target="_blank" class="link-card">
        Katalog Sepatu & Fashion 🛍️
      </a>

      <a href="#" target="_blank" class="link-card">
        Cek Stok & Ukuran 📦
      </a>
    </div>

    <footer>
      &copy; 2026 Hevio.id
    </footer>
  </div>

</body>
</html>
