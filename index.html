<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hevio.id | Official Link</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Space Grotesk', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      color: #e5e5e5;
      background-color: #0d0d0f;
      /* Background Carbon Fiber Tekstur Miring Presisi */
      background-image: 
        repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.035) 0px,
          rgba(255, 255, 255, 0.035) 2px,
          transparent 2px,
          transparent 6px
        ),
        repeating-linear-gradient(
          45deg,
          rgba(0, 0, 0, 0.6) 0px,
          rgba(0, 0, 0, 0.6) 2px,
          transparent 2px,
          transparent 6px
        ),
        linear-gradient(135deg, #18181c 0%, #08080a 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    /* Garis Aksen Diagonal Metalik di Latar Belakang */
    body::before {
      content: '';
      position: absolute;
      width: 150%;
      height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      top: 35%;
      left: -25%;
      transform: rotate(-35deg);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 150%;
      height: 1.5px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      bottom: 25%;
      left: -25%;
      transform: rotate(-35deg);
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 410px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    /* KARTU PROFIL UTAMA (FROSTED GLASS) */
    .profile-card {
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0.06) 50%,
        rgba(255, 255, 255, 0.02) 100%
      );
      backdrop-filter: blur(35px) saturate(190%);
      -webkit-backdrop-filter: blur(35px) saturate(190%);
      border: 1.2px solid rgba(255, 255, 255, 0.22);
      border-top: 1.8px solid rgba(255, 255, 255, 0.45);
      border-left: 1.4px solid rgba(255, 255, 255, 0.3);
      border-radius: 34px;
      padding: 34px 20px 26px 20px;
      box-shadow: 
        0 25px 50px -12px rgba(0, 0, 0, 0.85),
        inset 0 1px 1px rgba(255, 255, 255, 0.4);
      margin-bottom: 16px;
    }

    /* TAMPILAN LOGO HEVIO */
    .logo-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo-img {
      width: 155px;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      /* Efek Bayangan & Kilau Chrome */
      filter: 
        drop-shadow(0 12px 16px rgba(0, 0, 0, 0.9))
        drop-shadow(0 0 10px rgba(255, 255, 255, 0.35));
      transition: transform 0.3s ease;
    }

    .logo-img:hover {
      transform: scale(1.02);
    }

    /* TEKS BIO / DESKRIPSI */
    .bio .title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.2px;
    }

    .bio .subtitle {
      font-size: 0.92rem;
      color: #b5b5ba;
      line-height: 1.6;
      margin-bottom: 12px;
      font-weight: 400;
    }

    .bio .tagline {
      font-size: 0.84rem;
      color: #7b7b84;
      font-style: italic;
      font-weight: 400;
      letter-spacing: 0.2px;
    }

    /* LIST TOMBOL LINK */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 26px;
    }

    /* TOMBOL LINK KACA (PILL CAPSULE) */
    .link-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 20px;
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-top: 1.4px solid rgba(255, 255, 255, 0.35);
      border-radius: 999px;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: -0.1px;
      box-shadow: 
        0 8px 24px rgba(0, 0, 0, 0.6),
        inset 0 1px 1px rgba(255, 255, 255, 0.25);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-card:active {
      transform: scale(0.97);
      background: linear-gradient(
        140deg,
        rgba(255, 255, 255, 0.22) 0%,
        rgba(255, 255, 255, 0.07) 100%
      );
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
    }

    footer {
      font-size: 0.8rem;
      color: #585860;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- KARTU ATAS -->
    <div class="profile-card">
      <div class="logo-wrapper">
        <!-- Pastikan memasukkan link gambar PNG transparan logo Hevio -->
        <img class="logo-img" src="https://i.ibb.co.com/6RLdp5LX/1bc6718a-761b-4d86-8ba7-b008f5934a08-20260830-210024-0000.png" alt="Hevio Logo">
      </div>
      
      <div class="bio">
        <div class="title">Welcome To Hevio.id 🤍</div>
        <div class="subtitle">
          Satu toko, lengkapin gayamu ✨<br>
          Shoes 👟 | Fashion 👕 | Bags 👜
        </div>
        <div class="tagline">
          Find your style, make it yours.
        </div>
      </div>
    </div>

    <!-- TOMBOL LINK -->
    <div class="links">
      <a href="https://wa.me/6281252485561" target="_blank" class="link-card">
        Hubungi Admin via WA 💬
      </a>

      <a href="https://instagram.com/hevio.id" target="_blank" class="link-card">
        Kunjungi Instagram Hevio.id 📸
      </a>

      <a href="#" target="_blank" class="link-card">
        Katalog Sepatu & Fashion 🛍️
      </a>

      <a href="#" target="_blank" class="link-card">
        Cek Stok & Ukuran 📦
      </a>
    </div>

    <footer>
      &copy; 2026 Hevio.id
    </footer>
  </div>

</body>
</html>
